name: Build and deploy Node.js app to Azure Web App - tutor-ia-frontend-6927

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build (Vite)
        env:
          VITE_API_URL: https://tutor-ia-backend-6927.azurewebsites.net
        run: npm run build

      # Opción A (recomendada para tu startup actual): zip con la carpeta dist
      - name: Create deploy package
        run: zip -r deploy.zip dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_91872CF52B2F409CA6B1CE4BC907FCE7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C5C5A4451B1D4337805B65D3DDB87CDE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_14F67B6F49C542E593F67918097527C8 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: tutor-ia-frontend-6927
          slot-name: Production
          package: deploy.zip
